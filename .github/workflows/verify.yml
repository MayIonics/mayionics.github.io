name: Verify

on:
  push:
    branches:
      - main
      - 'p*'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run structural tests
        run: npm test

      - name: Validate D1 migrations and reservation capacity
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          connection = sqlite3.connect(':memory:')
          connection.execute('PRAGMA foreign_keys = ON')
          for migration in sorted(Path('migrations').glob('*.sql')):
              connection.executescript(migration.read_text(encoding='utf-8'))

          expected = {
              'products',
              'orders',
              'order_items',
              'payments',
              'shipments',
              'product_reservations',
          }
          actual = {
              row[0]
              for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
              )
          }
          if actual != expected:
              raise SystemExit(f'Unexpected tables: expected={sorted(expected)} actual={sorted(actual)}')

          connection.execute(
              "INSERT INTO products (id, slug, title, description, price_cents, quantity, condition, category, image_data, status, featured, created_at, updated_at) VALUES (?, ?, ?, '', ?, ?, 'NEW', ?, '[]', 'ACTIVE', 0, ?, ?)",
              ('prod-test', 'prod-test', 'Test product', 1000, 1, 'Test', '2026-08-30T20:00:00.000Z', '2026-08-30T20:00:00.000Z'),
          )
          connection.execute(
              "INSERT INTO product_reservations (id, product_id, reservation_token, reserved_quantity, status, expires_at, created_at, updated_at) VALUES (?, ?, ?, 1, 'ACTIVE', ?, ?, ?)",
              ('res-1', 'prod-test', 'token-1', '2099-01-01T00:00:00.000Z', '2026-08-30T20:00:00.000Z', '2026-08-30T20:00:00.000Z'),
          )
          try:
              connection.execute(
                  "INSERT INTO product_reservations (id, product_id, reservation_token, reserved_quantity, status, expires_at, created_at, updated_at) VALUES (?, ?, ?, 1, 'ACTIVE', ?, ?, ?)",
                  ('res-2', 'prod-test', 'token-2', '2099-01-01T00:00:00.000Z', '2026-08-30T20:00:00.000Z', '2026-08-30T20:00:00.000Z'),
              )
          except sqlite3.IntegrityError as exc:
              if 'reservation_capacity_exceeded' not in str(exc):
                  raise
          else:
              raise SystemExit('Reservation guard allowed inventory oversell')

          connection.execute("UPDATE product_reservations SET status = 'RELEASED' WHERE id = 'res-1'")
          connection.execute(
              "INSERT INTO product_reservations (id, product_id, reservation_token, reserved_quantity, status, expires_at, created_at, updated_at) VALUES (?, ?, ?, 1, 'ACTIVE', ?, ?, ?)",
              ('res-3', 'prod-test', 'token-3', '2099-01-01T00:00:00.000Z', '2026-08-30T20:00:00.000Z', '2026-08-30T20:00:00.000Z'),
          )

          violations = list(connection.execute('PRAGMA foreign_key_check'))
          if violations:
              raise SystemExit(f'Foreign-key violations: {violations}')
          PY
